# Lightweight dev stack: just the stateful services. Run api/worker/beat/web natively
# against these for fast reload — see the Makefile and README for the native flow.
# `docker-compose.yml` (full 6-service stack) remains the parity/deploy target.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coldreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coldreach}
      POSTGRES_DB: ${POSTGRES_DB:-coldreach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coldreach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
